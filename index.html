<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCNA Drills</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#12161B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCNA">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --bg:#12161B; --surface:#1A2129; --raise:#232D37; --line:#2B3742;
  --ink:#E9EFF4; --dim:#8FA0AF; --faint:#607282;
  --ok:#4FBFA4; --warn:#E8B54A; --alert:#E8574B;
  --accent:#4C9BE8; --on-accent:#0B1117;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:16px; --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#F3F5F7; --surface:#FFFFFF; --raise:#E9EDF1; --line:#D7DEE5;
    --ink:#131A21; --dim:#56667A; --faint:#8494A5;
    --ok:#1F8F74; --warn:#B07A10; --alert:#C8382C; --accent:#2F7BC0; --on-accent:#FFFFFF;
    color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{font-size:17px;line-height:1.4;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.drilling{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.drilling nav{display:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{padding:var(--pad);padding-top:calc(var(--pad) + env(safe-area-inset-top));max-width:760px;margin:0 auto}
h1{font-size:28px;font-weight:750;margin:4px 0 14px;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{font-size:19px;font-weight:700;margin:24px 0 10px}
h3{font-size:15px;font-weight:650;margin:0 0 8px;color:var(--dim)}
p{margin:0 0 8px}
.screen{display:none}
.screen.on{display:block;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;width:100%;text-align:left;display:block}
.card.tap:active{background:var(--raise)}
.muted{color:var(--dim);font-size:15px}
.tiny{font-size:13px;color:var(--faint)}
.ok{color:var(--ok)} .bad{color:var(--alert)} .warn{color:var(--warn)}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;vertical-align:middle}
.pill.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pill.bad{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 45%,var(--line))}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.pill.blue{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--dim);font-size:15px;margin-bottom:10px}
.note{font-size:14px;color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);border-left:3px solid var(--warn);padding:10px 12px;border-radius:0 8px 8px 0;margin:0 0 12px}

.btn{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;line-height:22px;text-align:center}
.btn:active{filter:brightness(1.15)}
.btn.wide{display:flex;width:100%;margin-top:10px}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--alert)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.row>.fix{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input:not([type=checkbox]):not([type=file]){background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;width:100%;-webkit-appearance:none;appearance:none;font-family:inherit;min-height:48px}
input[type=file]{display:none}
label.f{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:650;color:var(--dim);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle input{width:26px;height:26px;accent-color:var(--accent);flex:none}

/* home */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.hero button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;min-height:96px}
.hero button:first-child{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hero b{display:block;font-size:22px;font-weight:750;letter-spacing:-.02em}
.hero span{font-size:14px;opacity:.8}
.day{display:flex;gap:12px;align-items:center}
.day .dn{font-family:var(--mono);font-size:30px;font-weight:750;min-width:52px;color:var(--accent)}
.bar{height:8px;border-radius:5px;background:var(--raise);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.dom{padding:10px 0;border-bottom:1px solid var(--line)}
.dom:last-child{border-bottom:none}
.dom .top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.dom.off{opacity:.5}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.tile .k{font-size:12px;color:var(--dim);margin-top:3px}

/* lists */
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:none}
.li .main{min-width:0;flex:1}
.li .nm{font-weight:650;font-size:16px}
.li .sub{font-size:13px;color:var(--faint);margin-top:2px}
.li .side{text-align:right;font-size:13px;color:var(--dim);flex:none;font-family:var(--mono)}
.li.locked .nm{color:var(--faint)}
.lvl{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px;background:var(--line)}
.lvl.l1{background:var(--alert)} .lvl.l2{background:var(--warn)} .lvl.l3{background:var(--ok)} .lvl.l4{background:var(--accent)}
.cday{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.cday:last-child{border-bottom:none}
.cday .n{font-family:var(--mono);font-size:14px;color:var(--faint);width:34px;flex:none}
.cday .t{flex:1;min-width:0;font-size:15px}
.cday .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);flex:none;position:relative}
.cday.done .chk{background:var(--ok);border-color:var(--ok)}
.cday.done .chk::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.cday.done .t{color:var(--dim)}
.cday.cur{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:10px;padding-left:8px;padding-right:8px}
.cday.cur .n{color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin:6px 0 2px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0;height:100%}
.bfill{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bfill.zero{background:var(--line)}
.blab{font-size:10px;color:var(--faint);font-family:var(--mono)}

/* drill */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.clock{font-family:var(--mono);font-size:22px;font-weight:750}
.clock.low{color:var(--warn)}
.score{font-family:var(--mono);font-size:14px;color:var(--dim)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.qtopic{font-size:13px;color:var(--accent);font-weight:650;margin-bottom:6px}
.qtext{font-size:18px;line-height:1.45}
.qtext code,.mono{font-family:var(--mono);font-size:.95em;background:var(--raise);padding:1px 6px;border-radius:6px;word-break:break-all}
.qtext .big{display:block;font-family:var(--mono);font-size:22px;font-weight:700;margin:10px 0 2px;word-break:break-all;background:none;padding:0}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
.field input{font-family:var(--mono);font-size:19px}
.field input.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--raise))}
.field input.wrong{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 10%,var(--raise))}
.field .fix-ans{font-family:var(--mono);font-size:14px;color:var(--ok);margin-top:4px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.keys button{min-width:42px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:16px;font-weight:700;padding:0 8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.choices button{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:56px;padding:10px;font-size:16px;font-weight:650}
.choices button.good{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.choices button.wrong{border-color:var(--alert);color:var(--alert);background:color-mix(in srgb,var(--alert) 12%,var(--surface))}
.verdict{font-size:20px;font-weight:750;margin:4px 0 8px}
.expl{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px;line-height:1.55;margin-bottom:12px}
.expl p{margin:0 0 6px} .expl p:last-child{margin:0}
.expl code{font-family:var(--mono);font-size:.95em}
.expl table{border-collapse:collapse;font-size:13px;width:100%;margin-top:6px}
.expl td,.expl th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;font-family:var(--mono)}
.expl th{font-family:var(--sans);color:var(--dim);font-weight:600}
.bits{font-family:var(--mono);letter-spacing:.06em}
.bits b{color:var(--accent)}
.timesup{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:10px}

/* sheet, toast, nav */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px var(--pad) calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto;border-top:1px solid var(--line)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
#sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--bg);padding:6px 0 8px;z-index:2}
#sheet .sh b{font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;display:none;align-items:center;gap:14px;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:92vw}
#toast.on{display:flex;animation:up .2s}
#toast button{font-weight:800;color:var(--accent);padding:6px 8px;filter:brightness(.8)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;padding:10px 2px 12px;font-size:11px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:62px}
nav button[aria-current="true"]{color:var(--ink)}
nav svg,.icon-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
</style>
</head>
<body>

<main>
<section id="s-home" class="screen on"><div class="wrap"><h1><span>CCNA</span><button class="icon-btn" id="opensettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button></h1><div id="home"></div></div></section>
<section id="s-practice" class="screen"><div class="wrap"><h1>Practice</h1><div id="practice"></div></div></section>
<section id="s-course" class="screen"><div class="wrap"><h1>Course</h1><div id="course"></div></div></section>
<section id="s-stats" class="screen"><div class="wrap"><h1>Stats</h1><div id="stats"></div></div></section>
<section id="s-settings" class="screen"><div class="wrap"><h1>Settings</h1><div id="settings"></div></div></section>
<section id="s-drill" class="screen"><div class="wrap"><div id="drill"></div></div></section>
</main>

<div id="toast" role="status"><span id="toast-msg"></span><button id="toast-btn">Undo</button></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="scrim"></div><div class="panel"><div class="grab"></div>
<div class="sh"><b id="sheet-title"></b><button class="btn small" id="sheet-close">Close</button></div><div id="sheet-body"></div></div></div>

<nav>
<button data-tab="home" aria-current="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>Home</button>
<button data-tab="practice"><svg viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>Practice</button>
<button data-tab="course"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/></svg>Course</button>
<button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3"/></svg>Stats</button>
</nav>

<script>
/* =====================================================================
   helpers
   ===================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const chance=p=>Math.random()<p;
const pad2=n=>String(n).padStart(2,'0');
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const todayKey=()=>dayKey(Date.now());
const pct=x=>x==null||!isFinite(x)?'—':Math.round(x*100)+'%';
const secs=ms=>ms==null?'—':(ms<10000?(ms/1000).toFixed(1):Math.round(ms/1000))+'s';
function ago(ts){ if(!ts) return 'never'; const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.floor(m/60); if(h<24) return h+(h===1?' hour ago':' hours ago');
  const d=Math.floor(h/24); return d+(d===1?' day ago':' days ago') }
function buzz(ms){ if(navigator.vibrate) try{navigator.vibrate(ms||8)}catch(e){} }
const sig=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return s.length+':'+h};

/* ----- IPv4 math ----- */
function ip2n(s){ const p=String(s).trim().split('.'); if(p.length!==4) return null; let n=0;
  for(const x of p){ if(!/^\d{1,3}$/.test(x)) return null; const v=+x; if(v>255) return null; n=n*256+v } return n }
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const oct=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255];
const pmask=p=>p<=0?0:(0xFFFFFFFF<<(32-p))>>>0;
const netOf=(ip,p)=>(ip&pmask(p))>>>0;
const bcOf=(ip,p)=>(netOf(ip,p)|(~pmask(p)>>>0))>>>0;
const hostsOf=p=>Math.pow(2,32-p)-2;
function parseIpP(s){ const m=String(s).trim().match(/^([\d.]+)\s*[\/\s]\s*(\d{1,2})$/); if(!m) return null; const ip=ip2n(m[1]); const p=+m[2]; return ip==null||p>32?null:{ip,p} }
const bin8=v=>v.toString(2).padStart(8,'0');
function randIP(){
  const k=Math.random();
  if(k<.25) return ip2n('10.'+ri(0,255)+'.'+ri(0,255)+'.'+ri(0,255));
  if(k<.45) return ip2n('172.'+ri(16,31)+'.'+ri(0,255)+'.'+ri(0,255));
  if(k<.7) return ip2n('192.168.'+ri(0,255)+'.'+ri(0,255));
  let a; do{ a=ri(1,223) }while(a===127||a===10);
  return ip2n(a+'.'+ri(0,255)+'.'+ri(0,255)+'.'+ri(0,255));
}
function randPrefix(){ const k=Math.random(); return k<.55?ri(24,30):k<.85?ri(16,23):ri(9,15) }
/* an address that isn't the network or broadcast, so the question always has a real host */
function randHost(p){ let ip; for(let i=0;i<50;i++){ ip=randIP(); if(p>=31||(ip!==netOf(ip,p)&&ip!==bcOf(ip,p))) return ip } return ip }
function maskExpl(p){
  const full=Math.floor(p/8), rem=p%8, v=rem?256-Math.pow(2,8-rem):0;
  const parts=[]; for(let i=0;i<4;i++) parts.push(i<full?'255':i===full?String(v):'0');
  return '<p>/'+p+' = '+full+' full octet'+(full===1?'':'s')+' of 1s'+(rem?' plus '+rem+' more bit'+(rem>1?'s':'')+' in octet '+(full+1)+' ('+[128,64,32,16,8,4,2,1].slice(0,rem).join('+')+' = '+v+')':'')+', so the mask is <code>'+parts.join('.')+'</code>.</p>';
}
function netExpl(ip,p,show){
  const m=pmask(p), o=oct(ip), mo=oct(m); let h=maskExpl(p);
  if(p%8===0){ h+='<p>/'+p+' ends exactly on an octet boundary, so keep the first '+(p/8)+' octet'+(p===8?'':'s')+'. Network: the rest become 0. Broadcast: the rest become 255.</p>' }
  else{
    const k=Math.floor(p/8), B=256-mo[k], x=o[k], s=Math.floor(x/B)*B;
    h+='<p>The interesting octet is octet '+(k+1)+' (mask '+mo[k]+'), so the block size is 256 − '+mo[k]+' = <b>'+B+'</b>. Blocks go 0, '+B+', '+(2*B)+'…</p>'+

/* ----- IPv6 math ----- */
function v6parse(s){
  s=String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/\/\d+$/,'');
  if(!s||!/^[0-9a-f:]+$/.test(s)) return null;
  const d=s.split('::'); if(d.length>2) return null;
  const L=d[0]?d[0].split(':'):[], R=d.length===2&&d[1]?d[1].split(':'):[];
  if(d.length===1&&L.length!==8) return null;
  if(d.length===2&&L.length+R.length>7) return null;
  const g=[...L,...Array(d.length===2?8-L.length-R.length:0).fill('0'),...R];
  if(g.length!==8||g.some(x=>!/^[0-9a-f]{1,4}$/.test(x))) return null;
  return g.map(x=>parseInt(x,16));
}
function zeroRuns(g){ const runs=[]; let i=0; while(i<8){ if(g[i]===0){ let j=i; while(j<8&&g[j]===0) j++; runs.push([i,j-i]); i=j } else i++ } return runs }
function v6canon(g){
  const runs=zeroRuns(g).filter(r=>r[1]>=2); let best=null; for(const r of runs) if(!best||r[1]>best[1]) best=r;
  const h=g.map(x=>x.toString(16));
  if(!best) return h.join(':');
  return h.slice(0,best[0]).join(':')+'::'+h.slice(best[0]+best[1]).join(':');
}
const v6full=g=>g.map(x=>x.toString(16).padStart(4,'0')).join(':');
const sameG=(a,b)=>a&&b&&a.every((x,i)=>x===b[i]);
/* "fully shortened": no leading zeros, and :: (if used) covers a longest zero run */
function v6checkShort(str,g){
  const s=str.trim().toLowerCase(), notes=[];
  const toks=s.split('::').join(':').split(':').filter(Boolean);
  if(toks.some(t=>t.length>1&&t[0]==='0')) return {ok:false,why:'Leading zeros are still there. Drop them from every group (0db8 → db8, 0000 → 0).'};
  const runs=zeroRuns(g), longest=Math.max(0,...runs.map(r=>r[1]));
  const d=s.split('::');
  if(longest>=2){
    if(d.length<2) return {ok:false,why:'There\'s a run of all-zero groups. Replace the longest run with ::.'};
    const L=d[0]?d[0].split(':').length:0, R=d[1]?d[1].split(':').length:0, used=8-L-R;
    if(used<longest) return {ok:false,why:'The :: should replace the longest run of zero groups ('+longest+' groups), not a shorter one.'};
    if(v6canon(g)!==s) notes.push('Both runs are the same length. RFC 5952 (the rule in Day 33) puts the :: on the left one: <code>'+v6canon(g)+'</code>.');
  } else if(d.length===2) notes.push('There\'s only one zero group here. RFC 5952 says to write it as 0 rather than use :: for a single group.');
  if(/[A-F]/.test(str)) notes.push('RFC 5952 also says to write a–f in lowercase.');
  return {ok:true,notes};
}
function randV6(){
  const style=pick(['doc','doc','gua','ula','ll']);
  let g=Array.from({length:8},()=>chance(.35)?ri(1,0xfff):ri(0x1000,0xffff));
  if(style==='doc'){ g[0]=0x2001; g[1]=0x0db8 }
  if(style==='gua'){ g[0]=ri(0x2000,0x3fff) }
  if(style==='ula'){ g[0]=ri(0xfd00,0xfdff) }
  if(style==='ll'){ g=[0xfe80,0,0,0,...g.slice(4)] }
  if(style!=='ll'){
    const len=ri(2,4), start=ri(2,8-len); for(let i=start;i<start+len;i++) g[i]=0;
    if(chance(.25)){ const free=[2,3,4,5,6,7].filter(i=>g[i]!==0&&g[i-1]!==0&&(i===7||g[i+1]!==0)); if(free.length) g[pick(free)]=0 }
    if(chance(.2)){ g=[g[0],g[1],0,0,ri(1,0xffff),0,0,ri(1,0xffff)] }
  }
  return g;
}

{id:'v6short',name:'Shorten IPv6',topic:'v6',day:'31',obj:{v11:'1.8',v20:'1.4'},gen(){

{id:'v6exp',name:'Expand IPv6',topic:'v6',day:'31',obj:{v11:'1.8',v20:'1.4'},gen(){
  let g; do{ g=randV6() }while(!v6canon(g).includes('::'));

{id:'v6pre',name:'IPv6 network prefix',topic:'v6',day:'31',obj:{v11:'1.8',v20:'1.4'},gen(){
  const g=randV6(); g[3]=g[3]||ri(1,0xffff); g[4]=g[4]||ri(1,0xffff);

  const ng=g.map((x,i)=>{ const lo=i*16; if(lo+16<=p) return x; if(lo>=p) return 0; const keep=p-lo; return x&((0xffff<<(16-keep))&0xffff) });

    expl:'<p>Each hex digit is 4 bits, so /'+p+' keeps the first <b>'+digits+'</b> hex digits'+(p%16===0?' ('+whole+' full group'+(whole>1?'s':'')+')':' ('+whole+' full groups plus '+(digits%4)+' digit'+(digits%4>1?'s':'')+' of the next)')+'. Everything after becomes 0.</p><p>Full address: <code>'+v6full(g)+'</code></p><p>Prefix: <code>'+v6full(ng)+'</code> → <code>'+ans+'</code></p>'};

{id:'eui',name:'EUI-64',topic:'v6',day:'32',obj:{v11:'1.8',v20:'1.4'},gen(){
  const mac=Array.from({length:6},()=>ri(0,255)); if(chance(.5)) mac[0]&=~2; else mac[0]|=2;
  const hx=b=>b.toString(16).padStart(2,'0');
  const macCisco=[0,2,4].map(i=>hx(mac[i])+hx(mac[i+1])).join('.').toUpperCase();
  const f=mac[0]^2, idBytes=[f,mac[1],mac[2],0xff,0xfe,mac[3],mac[4],mac[5]];
  const id=[0,2,4,6].map(i=>hx(idBytes[i])+hx(idBytes[i+1])).join(':');
  const ex='<p>1. Split the MAC in half: <code>'+hx(mac[0])+hx(mac[1])+hx(mac[2])+'</code> | <code>'+hx(mac[3])+hx(mac[4])+hx(mac[5])+'</code></p>'+
    '<p>2. Put <code>fffe</code> in the middle: <code>'+hx(mac[0])+hx(mac[1])+':'+hx(mac[2])+'ff:fe'+hx(mac[3])+':'+hx(mac[4])+hx(mac[5])+'</code></p>'+

    '<p>Interface ID: <code>'+id+'</code></p>';

      expl:ex+'<p>Put it after the /64 prefix: <code>'+ans+'</code></p>'};
  }

    grade:a=>gradeEq({a:id},a,x=>String(x).toLowerCase().replace(/[^0-9a-f]/g,'')),expl:ex};
}},

function drillStats(id){
  const a=ATT.filter(x=>x[2]===id); const n=a.length, ok=a.reduce((s,x)=>s+x[3],0);
  const last=a.slice(-20), acc=last.length?last.reduce((s,x)=>s+x[3],0)/last.length:null;
  const t=last.filter(x=>x[3]).map(x=>x[4]).sort((x,y)=>x-y), med=t.length?t[Math.floor(t.length/2)]:null;
  const level=!n?0:(acc<.6||n<5)?1:acc<.85?2:(n>=20&&acc>=.9)?4:3;
  return {n,ok,acc,med,level,score:acc==null?0:acc*Math.min(1,n/20)};
}
const LEVELS=['Not started','Learning','Getting there','Solid','Mastered'];
function streak(){
  const days=new Set(ATT.map(x=>dayKey(x[0]))); let s=0; const d=new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ s++; d.setDate(d.getDate()-1) }
  return s;
}

let S=null, clockIv=null;
function startSession(mode,only,list){
  const pool=list?list:only?[only]:unlocked().map(d=>d.id);
  if(!pool.length){ toast('Nothing unlocked yet. Set your course day first.'); return }
  S={mode,pool,start:Date.now(),ends:mode==='quick'?Date.now()+10*60e3:mode==='lunch'?Date.now()+25*60e3:null,n:0,ok:0,by:{},wrong:[],recent:[],q:null};
  document.body.classList.add('drilling'); show('drill',true); nextQ();
  clearInterval(clockIv); clockIv=setInterval(tick,1000); tick();
}
function tick(){ const el=$('clock'); if(!el||!S) return;
  if(S.ends){ const left=Math.max(0,S.ends-Date.now()); el.textContent=Math.floor(left/60000)+':'+pad2(Math.floor(left%60000/1000)); el.classList.toggle('low',left<60e3) }
  else el.textContent=Math.floor((Date.now()-S.start)/60000)+':'+pad2(Math.floor((Date.now()-S.start)%60000/1000)); }
function pickDrill(){
  if(S.pool.length===1) return S.pool[0];
  const ci=curIdx(); const w=S.pool.map(id=>{ const s=drillStats(id), d=DBY[id];
    let x=s.n<5?1.6:1+(1-s.acc)*2.5; const gap=ci-dayIdx(d.day); if(gap>=0&&gap<=3) x+=.8;
    if(S.recent.slice(-2).every(r=>r===id)&&S.recent.length>=2) x=0; if(S.recent[S.recent.length-1]===id) x*=.35; return x });
  let r=Math.random()*w.reduce((a,b)=>a+b,0); for(let i=0;i<w.length;i++){ r-=w[i]; if(r<=0) return S.pool[i] } return S.pool[0];
}
function nextQ(){
  if(S.ends&&Date.now()>=S.ends) return finish();
  const id=pickDrill(), d=DBY[id]; let q;
  try{ q=d.gen() }catch(e){ console.error(e); q=DRILLS[0].gen() }
  S.q={id,q,t0:Date.now(),done:false}; S.recent.push(id);
  renderQ();
}
const KB={num:'inputmode="numeric" pattern="[0-9]*"',ip:'inputmode="decimal"',ipp:'inputmode="decimal"',bin:'inputmode="numeric" pattern="[0-9]*"',hex:'inputmode="text"',v6:'inputmode="text"'};
const KEYS={ipp:['/'],v6:[':','::','a','b','c','d','e','f','/'],hex:['a','b','c','d','e','f']};

function plain(html){ const t=document.createElement('div'); t.innerHTML=html.replace(/<br\s*\/?>/g,' / ').replace(/<span class="big">/g,' '); return t.textContent.replace(/\s+/g,' ').trim() }
function submit(choice){

    (r.notes&&r.notes.length?'<div class="note">'+r.notes.join('<br>')+'</div>':'')+
    '<div class="expl">'+q.expl+'</div>'+(q.choices?'<button class="btn wide go" id="q-next">Next</button>':'');
  if($('q-check')){ $('q-check').textContent='Next'; $('q-check').focus() }
  if($('q-next')) $('q-next').onclick=nextQ;
  document.querySelector('.score').textContent=S.ok+'/'+S.n;
  if(document.activeElement&&document.activeElement.tagName==='INPUT') document.activeElement.blur();
  const scrollTo=r.ok?($('q-check')||$('q-next')):$('q-fb'); if(scrollTo) scrollTo.scrollIntoView({block:r.ok?'end':'start',behavior:'smooth'});

/* =====================================================================
   GitHub sync: one file, data/ccna.json
   ===================================================================== */
const DATA_PATH='data/ccna.json';
const hasGH=()=>!!(GH&&GH.token&&GH.repo);
function guessRepo(){ const h=location.hostname, seg=location.pathname.split('/').filter(Boolean)[0];
  return /\.github\.io$/.test(h)&&seg&&!/\.html$/.test(seg)?h.split('.')[0]+'/'+seg:'' }
function b64(text){ const b=new TextEncoder().encode(text); let o=''; for(let i=0;i<b.length;i+=0x8000) o+=String.fromCharCode(...b.subarray(i,i+0x8000)); return btoa(o) }
function ghErr(code){
  if(code===401) return 'GitHub says the key is wrong or expired. Make a new one and connect again.';
  if(code===403||code===404) return 'That key can\'t write to '+GH.repo+'. Check the repo name and that the key has Contents: Read and write for it.';
  return 'GitHub error '+code+'. Will try again next time you open the app.';
}
async function net(url,opt){ try{ return await fetch(url,opt) }catch(e){ throw new Error('Couldn\'t reach GitHub. Check your connection.') } }
const ghHeaders=()=>({'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json'});
const ghUrl=p=>'https://api.github.com/repos/'+GH.repo+'/contents/'+p;
async function ghGet(path){ const g=await net(ghUrl(path)+'?t='+Date.now(),{headers:ghHeaders()}); if(g.status===404) return null; if(!g.ok) throw new Error(ghErr(g.status)); const j=await g.json(); return {sha:j.sha} }
async function ghRaw(path){ const r=await net(ghUrl(path),{headers:{...ghHeaders(),'Accept':'application/vnd.github.raw'},cache:'no-cache'}); if(r.status===404) return null; if(!r.ok) throw new Error(ghErr(r.status)); return await r.text() }
async function ghPut(path,text,msg){
  for(let t=0;t<2;t++){ const cur=await ghGet(path); const body={message:msg,content:b64(text)}; if(cur) body.sha=cur.sha;
    const r=await net(ghUrl(path),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)}); if(r.ok) return; if(r.status!==409&&r.status!==422) throw new Error(ghErr(r.status)) }
  throw new Error('GitHub kept rejecting the save. Will try again next time you open the app.');
}
function payload(){
  const att=ATT.slice().sort((a,b)=>a[0]-b[0]||(a[1]<b[1]?-1:1));
  return JSON.stringify({v:1,att,done:DONE,cur:CURDAY,mist:MIST.slice().sort((a,b)=>a.t-b.t),prefs:PREFS});
}
function mergeIn(r){
  let ch=0;
  const key=x=>x[0]+'|'+x[1], have=new Set(ATT.map(key));
  for(const x of r.att||[]) if(Array.isArray(x)&&!have.has(key(x))){ ATT.push(x); have.add(key(x)); ch++ }
  if(ch) ATT.sort((a,b)=>a[0]-b[0]);
  for(const [id,v] of Object.entries(r.done||{})) if(!DONE[id]||(v.at||0)>(DONE[id].at||0)){ DONE[id]=v; ch++ }
  if(r.cur&&(r.cur.at||0)>(CURDAY.at||0)){ CURDAY=r.cur; ch++ }
  const mk=new Set(MIST.map(m=>m.id)); for(const m of r.mist||[]) if(m&&m.id&&!mk.has(m.id)){ MIST.push(m); ch++ }
  if(ch){ MIST.sort((a,b)=>a.t-b.t); MIST=MIST.slice(-80) }
  for(const k of ['version','exam']) if(r.prefs&&r.prefs[k]&&(r.prefs[k].at||0)>(PREFS[k].at||0)){ PREFS[k]=r.prefs[k]; ch++ }
  if(ch){ store('att',ATT); store('done',DONE); store('cur',CURDAY); store('mist',MIST); store('prefs',PREFS) }
  return ch;
}
async function pull(){
  let text=null;
  if(hasGH()){ try{ text=await ghRaw(DATA_PATH); if(text==null) return {ch:0,remote:''} }catch(e){ SYNCERR=e.message } }
  if(text==null){ try{ const r=await fetch('./'+DATA_PATH,{cache:'no-cache'}); if(r.ok) text=await r.text() }catch(e){} }
  if(!text) return {ch:0,remote:''};
  try{ return {ch:mergeIn(JSON.parse(text)),remote:sig(text)} }catch(e){ return {ch:0,remote:''} }
}
let syncing=null, syncTimer=null;
function syncSoon(){ if(!hasGH()) return; store('ghDirty',true); clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,S?20000:2000) }
async function syncNow(){
  if(syncing) return syncing;
  syncing=(async()=>{
    try{ SYNCERR='';
      const {ch,remote}=await pull();
      if(ch&&CUR!=='drill'&&!$('sheet').classList.contains('on')) render(CUR);
      if(hasGH()&&!SYNCERR){ const text=payload(), s=sig(text);
        if(s!==remote&&s!==load('ghSig','')){ await ghPut(DATA_PATH,text,'CCNA progress '+todayKey()); store('ghSig',s) }
        store('ghDirty',false); store('ghAt',Date.now()) }
    }catch(e){ SYNCERR=e.message||String(e); store('ghDirty',true) }
    renderSyncStat();
  })();
  try{ await syncing }finally{ syncing=null }
}
function renderSyncStat(){ const st=$('g-stat'); if(!st) return;
  if(!hasGH()){ st.innerHTML='Not connected. Progress stays on this device only.'; return }
  const at=load('ghAt',0);
  st.innerHTML=SYNCERR?'<span class="bad">'+esc(SYNCERR)+'</span>':load('ghDirty',false)?'<span class="warn">Waiting to sync…</span>':'<span class="ok">Connected to '+esc(GH.repo)+'.</span>'+(at?' Last synced '+ago(at)+'.':'') }
async function connectGH(){
  const repo=$('g-repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  const token=$('g-token').value.replace(/[^\x21-\x7E]/g,'')||(GH&&GH.token)||'';
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ $('g-stat').innerHTML='<span class="bad">Repo should look like owner/repo.</span>'; return }
  if(!token){ $('g-stat').innerHTML='<span class="bad">Paste your GitHub key first.</span>'; return }
  if(!GH||GH.repo!==repo||GH.token!==token) store('ghSig','');
  GH={repo,token}; store('gh',GH); $('g-token').value=''; $('g-stat').textContent='Syncing…';
  await syncNow(); renderSettings(); if(!SYNCERR) toast('Synced');
}

/* =====================================================================
   nav + boot
   ===================================================================== */
function render(tab){ ({home:renderHome,practice:renderPractice,course:renderCourse,stats:renderStats,settings:renderSettings,drill:()=>{}})[tab]() }
function show(tab,keep){
  if(tab!=='drill'){ document.body.classList.remove('drilling'); clearInterval(clockIv); S=null }
  CUR=tab;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+tab));
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
  window.scrollTo(0,0); if(!keep) render(tab);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ buzz(); show(b.dataset.tab) });
$('opensettings').onclick=()=>show('settings');

let LASTSYNC=0;
function catchUp(force){ if(!force&&Date.now()-LASTSYNC<15000) return; LASTSYNC=Date.now(); syncNow() }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') catchUp() });
window.addEventListener('online',()=>catchUp(true));

show('home');
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
catchUp(true);
</script>
